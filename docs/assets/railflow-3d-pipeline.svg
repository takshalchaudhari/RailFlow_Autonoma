<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#09152b" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .card-head { font: 800 11px 'Consolas', monospace; letter-spacing: 0.8px; }
      .card-title { font: 800 15px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .card-desc { font: 500 11.5px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .card-rule { font: 700 10.5px 'Consolas', monospace; }
      @keyframes flowLine {
        to { stroke-dashoffset: -32; }
      }
      .anim-arrow {
        stroke-dasharray: 8 8;
        animation: flowLine 0.9s infinite linear;
      }
    </style>
  </defs>

  <rect width="1100" height="220" rx="14" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Connector Beams -->
  <line x1="255" y1="110" x2="295" y2="110" stroke="#38bdf8" stroke-width="3" class="anim-arrow" filter="url(#neon)" />
  <line x1="525" y1="110" x2="565" y2="110" stroke="#f59e0b" stroke-width="3" class="anim-arrow" filter="url(#neon)" />
  <line x1="795" y1="110" x2="835" y2="110" stroke="#10b981" stroke-width="3" class="anim-arrow" filter="url(#neon)" />

  <!-- STAGE 1: VOICE & NLP -->
  <g transform="translate(22, 24)">
    <polygon points="8,0 232,0 224,172 0,172" fill="#0b1930" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="18" y="16" width="190" height="22" rx="4" fill="#0c4a6e" />
    <text x="26" y="31" class="card-head" fill="#7dd3fc">STAGE 1 · VOICE / NLP</text>
    <text x="18" y="62" class="card-title">Speak or Type Alert</text>
    <text x="18" y="84" class="card-desc">"Delay T101 by 20m and</text>
    <text x="18" y="100" class="card-desc">close P2 from 09:20–10:00"</text>
    <rect x="18" y="132" width="190" height="24" rx="4" fill="#082f49" stroke="#0284c7" />
    <text x="26" y="148" class="card-rule" fill="#38bdf8">🚫 AI Cannot Assign Tracks</text>
  </g>

  <!-- STAGE 2: HUMAN SIGNALLER GATE -->
  <g transform="translate(292, 24)">
    <polygon points="8,0 232,0 224,172 0,172" fill="#1c160b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="18" y="16" width="190" height="22" rx="4" fill="#78350f" />
    <text x="26" y="31" class="card-head" fill="#fde68a">STAGE 2 · HUMAN SIGN-OFF</text>
    <text x="18" y="62" class="card-title">Controller Confirms</text>
    <text x="18" y="84" class="card-desc">Signaller inspects staged</text>
    <text x="18" y="100" class="card-desc">events before solving</text>
    <rect x="18" y="132" width="190" height="24" rx="4" fill="#451a03" stroke="#d97706" />
    <text x="26" y="148" class="card-rule" fill="#fbbf24">✓ Mandatory Human Gate</text>
  </g>

  <!-- STAGE 3: GOOGLE OR-TOOLS CP-SAT -->
  <g transform="translate(562, 24)">
    <polygon points="8,0 232,0 224,172 0,172" fill="#17102a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="18" y="16" width="190" height="22" rx="4" fill="#581c87" />
    <text x="26" y="31" class="card-head" fill="#e9d5ff">STAGE 3 · CP-SAT SOLVER</text>
    <text x="18" y="62" class="card-title">Mathematical Re-Route</text>
    <text x="18" y="84" class="card-desc">Switches T103 (P2 → P3)</text>
    <text x="18" y="100" class="card-desc">&amp; holds T102/T104 (+10m gap)</text>
    <rect x="18" y="132" width="190" height="24" rx="4" fill="#3b0764" stroke="#9333ea" />
    <text x="26" y="148" class="card-rule" fill="#d8b4fe">⚡ Deterministic Optimum</text>
  </g>

  <!-- STAGE 4: INDEPENDENT SAFETY FIREWALL -->
  <g transform="translate(832, 24)">
    <polygon points="8,0 242,0 234,172 0,172" fill="#06241c" stroke="#10b981" stroke-width="2" />
    <rect x="18" y="16" width="202" height="22" rx="4" fill="#065f46" />
    <text x="26" y="31" class="card-head" fill="#a7f3d0">STAGE 4 · SAFETY FIREWALL</text>
    <text x="18" y="62" class="card-title">6-Rule Validator</text>
    <text x="18" y="84" class="card-desc">Verifies zero overlap &amp;</text>
    <text x="18" y="100" class="card-desc">10m clearance before green</text>
    <rect x="18" y="132" width="202" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="26" y="148" class="card-rule" fill="#34d399">🛡️ VALID → Issue Green Signal</text>
  </g>
</svg>
